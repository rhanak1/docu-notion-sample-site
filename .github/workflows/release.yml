name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      outlines:
        description: 'Comma-separated list of outlines to generate PDFs for (leave blank for all)'
        required: false
        default: ''
      logLevel:
        description: "Log level"
        required: false
        default: "warning"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          
      - name: Install dependencies
        run: yarn

      - name: Set outlines variable
        id: outlines
        run: |
          if [ -z "${{ github.event.inputs.outlines }}" ]; then                
            echo "outlines=Keyboard-App-Builder,Scripture-App-Builder" >> $GITHUB_OUTPUT
          else
            echo "outlines=${{ github.event.inputs.outlines }}" >> $GITHUB_OUTPUT
          fi
          
      - name: Generate PDFs
        run: |
          OUTLINE_MAPPING=$(cat outlines.json)
          IFS=',' read -ra OUTLINE_ARRAY <<< "${{ steps.outlines.outputs.outlines }}"
          for outline in "${OUTLINE_ARRAY[@]}"; do
            outline_trimmed=$(echo "$outline" | xargs)                        #Extract root page ID using jq
            root_page_id=$(echo "$OUTLINE_MAPPING" | jq -r --arg key "$outline_trimmed" '.[$key]')
            if [ "$root_page_id" = "null" ] || [ -z "$root_page_id" ]; then
              echo "No root page ID found for $outline_trimmed, skipping."
              continue
            fi
            echo "Generating PDF for $outline_trimmed (root page: $root_page_id)"
            export DOCU_NOTION_SAMPLE_ROOT_PAGE=$root_page_id
            echo "$DOCU_NOTION_INTEGRATION_TOKEN"
            yarn pull
            yarn build
            npm install -g http-server wait-on
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            http-server build/ -p 3000 --silent &
            wait-on http://localhost:3000
            npx docu-pdf http://localhost:3000 --outputPath $outline_trimmed.pdf
            gh run upload-artifact --name $outline_trimmed --path $outline_trimmed.pdf
          done
        
